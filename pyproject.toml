[project]
name = "sec-check"
version = "0.1.0"
description = "Escáner de secretos con triaje LLM: redacta antes de enviar."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
sec-check = "sec_check.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_check"]

[dependency-groups]
dev = ["pytest>=8,<9"]